[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planminpy"
version = "0.1.0"
description = "Educational mine-planning application foundation"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "plotly==6.9.0",
    "scipy==1.18.0",
]

[project.scripts]
planminpy = "planminpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
